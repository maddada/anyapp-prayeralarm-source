plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.anyappalarms'
version = '1.0.0'

android {
  namespace "expo.modules.anyappalarms"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lint {
    abortOnError false
  }
}

dependencies {
  // Reads the text on a photo of the mosque's prayer board, on the phone (no internet, no account).
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}

